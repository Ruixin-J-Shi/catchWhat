<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e0e5ed">
<meta name="description" content="A flock of prey, one hunter, five forces. An interactive boids simulation.">
<title>catchWhat — a flock and a hunter</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="stage"></canvas>

<header id="bar">
  <h1>catch<span>What</span></h1>
  <dl id="stats">
    <div><dt>fps</dt><dd id="fps">–</dd></div>
    <div><dt>prey</dt><dd id="count">–</dd></div>
    <div><dt>caught</dt><dd id="caught">0</dd></div>
  </dl>
  <button id="toggle" aria-label="Controls" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2.2"/><circle cx="10" cy="16" r="2.2"/></svg>
  </button>
</header>

<p id="hint">drag anywhere to steer the hunter</p>

<div id="scrim" hidden></div>

<section id="panel" hidden aria-label="Simulation controls">
  <button class="grip" aria-label="Close controls"></button>

  <fieldset>
    <legend>flock</legend>
    <label>prey <input class="num" type="number" data-num="preyCount" min="1" max="500" step="1" value="12" aria-label="preyCount value">
      <input type="range" id="preyCount" min="1" max="500" step="1" value="12"></label>
    <label>cohesion <input class="num" type="number" data-num="cohesion" min="0" max="200" step="1" value="95" aria-label="cohesion value">
      <input type="range" id="cohesion" min="0" max="200" step="1" value="95"></label>
    <label>separation <input class="num" type="number" data-num="separation" min="0" max="300" step="1" value="130" aria-label="separation value">
      <input type="range" id="separation" min="0" max="300" step="1" value="130"></label>
    <label>alignment <input class="num" type="number" data-num="alignment" min="0" max="200" step="1" value="115" aria-label="alignment value">
      <input type="range" id="alignment" min="0" max="200" step="1" value="115"></label>
  </fieldset>

  <fieldset>
    <legend>predators</legend>
    <label>count <input class="num" type="number" data-num="hunterCount" min="1" max="6" step="1" value="1" aria-label="hunterCount value">
      <input type="range" id="hunterCount" min="1" max="6" step="1" value="1"></label>
    <label>fear <input class="num" type="number" data-num="fear" min="0" max="400" step="1" value="220" aria-label="fear value">
      <input type="range" id="fear" min="0" max="400" step="1" value="220"></label>
    <label>fear radius <input class="num" type="number" data-num="fearRadius" min="20" max="400" step="5" value="170" aria-label="fearRadius value">
      <input type="range" id="fearRadius" min="20" max="400" step="5" value="170"></label>
    <label>speed <input class="num" type="number" data-num="hunterSpeed" min="40" max="400" step="5" value="185" aria-label="hunterSpeed value">
      <input type="range" id="hunterSpeed" min="40" max="400" step="5" value="185"></label>
  </fieldset>

  <fieldset>
    <legend>world</legend>
    <label>wall push <input class="num" type="number" data-num="wall" min="0" max="500" step="1" value="340" aria-label="wall value">
      <input type="range" id="wall" min="0" max="500" step="1" value="340"></label>
    <label>wall range <input class="num" type="number" data-num="wallRange" min="20" max="320" step="5" value="140" aria-label="wallRange value">
      <input type="range" id="wallRange" min="20" max="320" step="5" value="140"></label>
    <label>pixel size <input class="num" type="number" data-num="pixel" min="1" max="6" step="1" value="3" aria-label="pixel value">
      <input type="range" id="pixel" min="1" max="6" step="1" value="3"></label>
    <label class="check"><input type="checkbox" id="trails" checked> motion trails</label>
    <label class="check"><input type="checkbox" id="showVectors"> force vectors</label>
  </fieldset>

  <div class="btns">
    <button id="reset">reset</button>
    <button id="defaults">defaults</button>
  </div>
</section>

<script src="/sim.js"></script>
<script>
  // Live reload is a local-dev affordance only. On a static host (Vercel) there is no
  // /events endpoint, and an unguarded EventSource would retry forever.
  if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
    const es = new EventSource('/events');
    es.addEventListener('reload', () => location.reload());
  }
</script>
</body>
</html>
